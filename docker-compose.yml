services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: parallelpcapanalysis:latest
    container_name: parallelpcapanalysis-dashboard
    working_dir: /workspace
    command: ["streamlit", "run", "/workspace/app_gpu_dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      PCAP_DIR: /data/pcaps
      RESULTS_DIR: /data/results
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: 4096
    volumes:
      - C:/docker_shared/Resultados/pcaps:/data/pcaps
      - C:/docker_shared/Resultados/results:/data/results
    shm_size: 1gb
    stdin_open: true
    tty: true

    # Portainer: quando a stack for implantada a partir de Git, o webhook pode
    # fazer o redeploy automático sempre que houver push no branch usado pela stack.

# Using host bind mounts (see README) — no named volumes defined here
