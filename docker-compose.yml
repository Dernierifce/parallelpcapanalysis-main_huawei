services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: parallelpcapanalysis:latest
    container_name: parallelpcapanalysis-dashboard
    working_dir: /workspace
    command: ["streamlit", "run", "/workspace/app_gpu_dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PCAP_DIR: /data/pcaps
      RESULTS_DIR: /data/results
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: 4096
    gpus: all
    volumes:
      - pcap_data:/data/pcaps
      - results_data:/data/results
    shm_size: 1gb
    stdin_open: true
    tty: true

volumes:
  pcap_data:
  results_data:
